version: 2
updates:
  # All workspaces (packages/astro, worker, demo) share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # All update types (major included) so nothing lands as a lone PR.
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'
