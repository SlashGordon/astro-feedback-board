name: Release

on:
  push:
    branches: [main]
  # Publishes an existing release tag to npm, for example after a failed publish job.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.3.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "release PR" that bumps packages/astro/package.json +
  # packages/astro/CHANGELOG.md from the Conventional Commit history. Merging
  # that PR tags the release and creates the GitHub Release, which sets
  # `release_created` for the publish job below.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/astro--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/astro--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm when release-please just cut a new release, or by hand.
  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — npm trusted publishing + provenance
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (tokenless OIDC auth) needs npm >= 11.5.1;
      # Node 22 still bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm --version

      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./packages/astro/package.json').version")"
          echo "git tag=$TAG  package.json=$pkg"
          test "$pkg" = "$TAG"

      - run: npm ci
      # Only the package's own tests: the Worker is not published, and CI runs
      # every test on each push.
      - run: npm run typecheck && npm test --workspace packages/astro
      - run: npm publish --workspace packages/astro --provenance --access public
